name: Daraz Mobile Voucher Tracker

on:
  schedule:
    # Runs at 00:05 PKT (19:05 UTC) when daily mobile vouchers drop, and periodically during the day
    - cron: "5 19,23,3,7,11,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daraz-offers
  cancel-in-progress: false

jobs:
  track-daraz-vouchers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep scheduled workflow active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "/repos/${{ github.repository }}/actions/workflows/daraz-card-tracker.yml/enable" || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Daraz Mobile App Voucher Tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'darazcardsalesRB17247365Dtqtqtqty' }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER || 'https://ntfy.sh' }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          python3 track_daraz_cards.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r state /tmp/state_backup
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -r /tmp/state_backup/* state/ 2>/dev/null || true
            git add state/
            if git diff --cached --quiet; then
              break
            fi
            git commit -m "chore: sync Daraz mobile app vouchers state [skip ci]"
            if git push origin HEAD:main; then
              break
            fi
            sleep 2
          done
