name: Daraz Android app voucher scan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daraz-app-vouchers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-voucher-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install --global appium
          appium driver install uiautomator2

      - name: Boot Android 11 emulator, install verified APKPure XAPK, and scan
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'darazcardsalesRB17247365Dtqtqtqty' }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 900
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            python3 -m venv .venv-appium
            . .venv-appium/bin/activate
            python -m pip install --disable-pip-version-check --quiet Appium-Python-Client

            # Verify APKPure's published SHA-256 and Daraz signer before sideloading split APKs.
            python scripts/install_daraz_xapk.py

            # Keep Appium's request log out of Actions logs.
            appium --address 127.0.0.1 --port 4723 --log-level error --log /tmp/appium.log >/dev/null 2>&1 &
            for attempt in $(seq 1 60); do
              if curl --silent --fail http://127.0.0.1:4723/status >/dev/null; then
                break
              fi
              sleep 2
            done
            curl --silent --fail http://127.0.0.1:4723/status >/dev/null

            python scripts/appium_product_vouchers.py

      - name: Upload Emulator Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daraz-emulator-screenshots
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit voucher state (when changed)
        if: always() && hashFiles('data/app-product-vouchers.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/app-product-vouchers.json /tmp/app-product-vouchers.json.new
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/app-product-vouchers.json.new data/app-product-vouchers.json
            git add data/app-product-vouchers.json
            if git diff --cached --quiet; then
              break
            fi
            git commit -m "chore: update Daraz Android app voucher state [skip ci]"
            if git push origin HEAD:main; then
              break
            fi
            sleep 2
          done
