name: Check Daraz Card Offers (Start-of-Day PKT + Intraday New Offers Only)

on:
  schedule:
    # 19:05 UTC = 12:05 AM PKT (Start of the day in Pakistan), plus every 6 hours to catch new intraday offers
    - cron: '5 19,1,7,13 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force send notification even if today was already notified and no new offers appeared'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: daraz-offers
  cancel-in-progress: false

jobs:
  track-live-gcp-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          which google-chrome || which chromium-browser || npx playwright install chromium

      - name: Run Strict DOM & Daily PKT Discount Tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'darazcardsalesRB17247365Dtqtqtqty' }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
        run: npx tsx src/tracker.ts

      - name: Commit updated live offer state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json state/daraz_card_state.json || true
          git diff --staged --quiet || (git commit -m "chore: update verified live Daraz DOM & daily PKT voucher state [skip ci]" && git pull --rebase origin main && git push)
