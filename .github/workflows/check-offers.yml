name: Check Daraz Card Offers

on:
  schedule:
    - cron: '5 19,1,7,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daraz-offers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Playwright Chromium with system dependencies
        run: |
          echo 'APT::Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          npm install --no-save --legacy-peer-deps playwright
          npx playwright install chromium
          sudo apt-get update -o Acquire::Retries=5 || true
          npx playwright install-deps chromium || true

      - name: Run Daraz Live Playwright Tracker
        run: npx tsx src/tracker.ts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}

      - name: Upload Page Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daraz-page-screenshots
          path: artifacts/
          retention-days: 7

      - name: Commit and Push state.json
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/state.json /tmp/state.json.new
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.json.new data/state.json
            git add data/state.json
            if git diff --cached --quiet; then
              echo "No state changes to commit."
              break
            fi
            git commit -m 'Update Daraz scraped offer state [skip ci]'
            if git push origin HEAD:main; then
              break
            fi
            sleep 2
          done
