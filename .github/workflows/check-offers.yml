name: Check Daraz Card Offers

on:
  schedule:
    - cron: '5 19,1,7,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daraz-offers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Daraz Live Playwright Tracker
        run: npx tsx src/tracker.ts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Upload Page Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daraz-page-screenshots
          path: artifacts/
          retention-days: 7

      - name: Commit and Push state.json
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Daraz scraped offer state [skip ci]'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
