name: Check Daraz Card Offers (Strict Live DOM & Daily PKT Discounts)

on:
  schedule:
    - cron: '5 4,14 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Send ntfy push notification for daily active offers even if state is unchanged'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: daraz-offers
  cancel-in-progress: false

jobs:
  track-live-gcp-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          which google-chrome || which chromium-browser || npx playwright install chromium

      - name: Run Strict DOM & Daily PKT Discount Tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'darazcardsalesRB17247365Dtqtqtqty' }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'true' }}
        run: npx tsx src/tracker.ts

      - name: Commit updated live offer state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json state/daraz_card_state.json || true
          git diff --staged --quiet || (git commit -m "chore: update verified live Daraz DOM & daily PKT voucher state [skip ci]" && git pull --rebase origin main && git push)
