name: Check Daraz Card Offers

on:
  schedule:
    - cron: '5 19,23,3,7,11,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daraz-offers
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan live Daraz.pk GCP payment channels and send ntfy alerts
        run: npm run check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'darazcardsalesRB17247365Dtqtqtqty' }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
      - name: Save offer history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          git diff --cached --quiet || git commit -m 'Update Daraz live GCP offer history'
          git push
